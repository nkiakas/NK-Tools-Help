name: Publish help
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install mkdocs-material mkdocs-static-i18n
      - run: mkdocs gh-deploy --force
        - locale: el
          name: Ελληνικά
          build: true
          nav_translations:
            Home: Αρχική
            Surfaces: Εδάφη
            Points: Σημεία
            Alignments: Πολυγωνικές οδού
            Profiles: Μηκοτομές
            Utilities: Βοηθήματα